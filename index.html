    /* ---------------- 数据来源卡片（回答下方：这些数字到底出自哪里） ---------------- */
    // 支持两种形态：
    //   ① 普通问答后端登记的出处：{kind,label,name,tables,rows,detail,sql}
    //   ② 深度搜索的证据片段：    {index,source,chunk_index,page,snippet}
    // 渲染目标：一眼看清「从哪来」——彩色类型徽章 + 友好名称 + 表名/行数标签，SQL 折叠收纳。
    const SRC_ICONS = {
      database: '<ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v13c0 1.6 3.4 2.8 7.5 2.8s7.5-1.2 7.5-2.8v-13"/><path d="M4.5 12c0 1.6 3.4 2.8 7.5 2.8s7.5-1.2 7.5-2.8"/>',
      tables: '<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M9 9.5v10"/>',
      knowledge: '<path d="M14 3.5H7.5a1.8 1.8 0 0 0-1.8 1.8v13.4a1.8 1.8 0 0 0 1.8 1.8h9a1.8 1.8 0 0 0 1.8-1.8V8z"/><path d="M13.8 3.5V8h4.5"/><path d="M8.6 13h6.8M8.6 16.4h4.2"/>',
      forecast: '<path d="M3.5 16.8l5.2-5.2 3.4 3.4 6.4-6.4"/><path d="M13.5 8.6h5.6v5.6"/>',
      chart: '<path d="M3.5 20h17"/><rect x="5.6" y="11" width="3" height="6.4" rx=".8"/><rect x="10.8" y="7" width="3" height="10.4" rx=".8"/><rect x="16" y="13.6" width="3" height="3.8" rx=".8"/>',
      doc: '<path d="M4.5 4.5h15v15h-15z"/><path d="M7.8 9h8.4M7.8 12.4h8.4M7.8 15.8h5"/>',
    };
    const SRC_TAGS = { database: '数据库', tables: '表格库', knowledge: '知识库', forecast: '预测', chart: '图表' };
    const DB_FRIENDLY = {
      financial_asset_management: '金融业务库',
      healthcare_analytics_competition: '医疗业务库',
      telecom_operations_db: '通信业务库',
    };

    function svgNode(path, size, cls) {
      const span = el('span', cls || 'ds-ico');
      span.style.display = 'inline-grid';
      span.style.placeItems = 'center';
      span.innerHTML = '<svg width="' + (size || 12) + '" height="' + (size || 12) + '" viewBox="0 0 24 24" '
        + 'fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'
        + path + '</svg>';
      return span;
    }

    function splitPath(p) {
      const s = String(p || '').replace(/\\/g, '/');
      const i = s.lastIndexOf('/');
      return i < 0 ? { file: s, dir: '' } : { file: s.slice(i + 1), dir: s.slice(0, i) };
    }

    // 「非结构化表格库 · 某数据集」这类 label 的后半段（oa 之外的具体名）
    function labelBranch(label) {
      const s = String(label || '');
      const i = s.indexOf(' · ');
      return i < 0 ? '' : s.slice(i + 3).trim();
    }

    function buildSourceItem(it) {
      const kind = SRC_TAGS[it.kind] ? it.kind : 'doc';
      const branch = labelBranch(it.label);
      let title = '', sub = '', notes = [];

      if (kind === 'database') {
        title = DB_FRIENDLY[it.name] || branch || it.name;
        sub = 'MySQL · ' + it.name;
      } else if (kind === 'tables') {
        title = branch || it.name;                       // 数据集名当主标题，表 id 当副标题
        sub = it.name;
        if (it.detail) notes.push(it.detail);
      } else if (kind === 'knowledge') {
        const parts = splitPath(it.name);
        title = parts.file || it.name;
        sub = parts.dir;
        if (it.detail) notes.push(it.detail);
      } else if (kind === 'forecast') {
        const parts = String(it.detail || '').split(' · ').filter(Boolean);
        title = parts[0] || branch || it.name;
        sub = branch ? '机器学习预测 · ' + branch : '';
        notes = parts.slice(1);
      } else if (kind === 'chart') {
        const m = String(it.detail || '').match(/《([^》]+)》/);
        title = m ? m[1] : branch || '生成图表';
        const rest = String(it.detail || '').split('，').slice(1).join('，').trim();
        if (rest) notes.push(rest);
      }

      const item = el('div', 'ds-item k-' + (SRC_TAGS[kind] ? kind : 'knowledge'));
      const badge = el('span', 'ds-badge');
      badge.appendChild(svgNode(SRC_ICONS[kind] || SRC_ICONS.doc, 12));
      badge.appendChild(el('span', null, SRC_TAGS[kind] || '引用'));
      item.appendChild(badge);

      const main = el('div', 'ds-main');
      main.appendChild(el('div', 'ds-name', title));
      if (sub) main.appendChild(el('div', 'ds-sub', sub));
      item.appendChild(main);

      const body = el('div', 'ds-body');
      // 表格库的主/副标题里已经有表 id，不必再用 chip 重复一遍
      (kind === 'tables' ? [] : (it.tables || [])).slice(0, 12).forEach(function (t) {
        body.appendChild(el('span', 'ds-chip', t));
      });
      if (it.rows != null) {
        const rows = Number(it.rows);
        body.appendChild(el('span', 'ds-pill', (isNaN(rows) ? it.rows : rows.toLocaleString('zh-CN')) + ' 行数据'));
      }
      notes.forEach(function (t) { if (t) body.appendChild(el('span', 'ds-note', t)); });
      if (body.children.length) item.appendChild(body);

      if (it.sql) {
        const det = document.createElement('details');
        det.className = 'ds-sql';
        const sum = el('summary', null, '查看执行的 SQL');
        det.appendChild(sum);
        const pre = document.createElement('pre');
        pre.textContent = it.sql;
        det.appendChild(pre);
        item.appendChild(det);
      }
      return item;
    }

    // 深度搜索的引用片段：[1] 文件名 · 第几段 / PDF 第几页 + 摘录
    function buildDeepItem(it) {
      const parts = splitPath(it.source);
      const item = el('div', 'ds-item k-knowledge');
      const badge = el('span', 'ds-badge');
      badge.appendChild(svgNode(SRC_ICONS.doc, 12));
      badge.appendChild(el('span', null, it.index != null ? '引用 [' + it.index + ']' : '引用'));
      item.appendChild(badge);

      const main = el('div', 'ds-main');
      main.appendChild(el('div', 'ds-name', parts.file || it.source || '知识库文档'));
      if (parts.dir) main.appendChild(el('div', 'ds-sub', parts.dir));
      item.appendChild(main);

      const body = el('div', 'ds-body');
      if (it.chunk_index != null) body.appendChild(el('span', 'ds-pill', '第 ' + it.chunk_index + ' 段'));
      if (it.page) body.appendChild(el('span', 'ds-pill', 'PDF 第 ' + it.page + ' 页'));
      if (it.snippet) body.appendChild(el('span', 'ds-note', it.snippet));
      if (body.children.length) item.appendChild(body);
      return item;
    }

    function renderSources(box, content, items) {
      if (!box || !items || !items.length) return;
      const old = box.querySelector('.data-src');
      if (old) old.remove();
      const sec = el('div', 'data-src');

      // 标题栏：点击整块折叠 / 展开
      const head = document.createElement('button');
      head.type = 'button';
      head.className = 'ds-head';
      head.title = '点击展开 / 收起数据来源';
      head.appendChild(svgNode(SRC_ICONS.database, 14, 'ds-head-icon'));
      head.appendChild(el('span', null, '数据来源'));
      head.appendChild(el('span', 'ds-count', items.length + ' 处'));
      const caret = el('span', 'ds-caret');
      caret.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
        + 'stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
      head.appendChild(caret);
      head.addEventListener('click', function () { sec.classList.toggle('folded'); });
      sec.appendChild(head);

      const list = el('div', 'ds-list');
      items.forEach(function (it) {
        list.appendChild(it && it.source ? buildDeepItem(it) : buildSourceItem(it));
      });
      sec.appendChild(list);
      // 出处特别多时先收起，别让一长串卡片把正文挤没了（点标题即可展开）
      if (items.length > 6) sec.classList.add('folded');

      // 放在 AI 卡片之后（有下一屏内容时自然排在最后）
      const anchor = content && content.parentElement ? content.parentElement.nextSibling : null;
      box.insertBefore(sec, anchor);
    }

    /* ---------------- 执行计划（Planning）面板 ---------------- */
    const PLAN_MARKS = { done: '✓', doing: '▶', pending: '○', skipped: '–', failed: '!' };

    // 在后端产出的 plan / plan_step / thinking 事件上实时渲染「先拆解、再执行」的进度面板
    function makePlanPanel(box, content, plan) {
      const host = el('div', 'plan-panel');
      box.insertBefore(host, content.parentElement);   // 计划面板置于 AI 卡片之前
      const rows = new Map();                          // 步骤 id → 行节点
      let head = null;
      let stepsHost = null;

      const ensureSkeleton = (goal) => {
        if (head) return;
        const thinking = host.querySelector('.plan-thinking');
        if (thinking) thinking.remove();
        head = el('div', 'plan-head');
        head.appendChild(el('span', 'plan-title', '执行计划'));
        if (goal) head.appendChild(el('span', 'plan-goal', goal));
        head.appendChild(el('span', 'plan-progress', ''));
        stepsHost = el('div', 'plan-steps');
        host.append(head, stepsHost);
      };

      const paintProgress = (progress) => {
        if (!head || !progress) return;
        const node = head.querySelector('.plan-progress');
        if (node) node.textContent = progress.done + '/' + progress.total + ' 步';
      };

      const buildRow = (step) => {
        const row = el('div', 'plan-step st-' + (step.status || 'pending'));
        row.dataset.step = String(step.id);
        row.appendChild(el('span', 'ps-icon', PLAN_MARKS[step.status] || '○'));
        row.appendChild(el('span', 'ps-title', step.title || ''));
        if (step.note) row.appendChild(el('span', 'ps-note', '（' + step.note + '）'));
        rows.set(String(step.id), row);
        return row;
      };

      const countDone = () => {
        let done = 0;
        rows.forEach((row) => { if (row.classList.contains('st-done') || row.classList.contains('st-skipped')) done += 1; });
        paintProgress({ done, total: rows.size });
      };

      const api = {};
      api.thinking = (message) => {
        if (head) return;                              // 计划已出来就不用再显示“正在制定”
        let row = host.querySelector('.plan-thinking');
        if (!row) { row = el('div', 'plan-thinking'); host.appendChild(row); }
        row.textContent = '⏳ ' + (message || '处理中…');
      };
      api.render = (data) => {
        ensureSkeleton(data.goal || '');
        stepsHost.innerHTML = '';
        rows.clear();
        (data.steps || []).forEach((step) => stepsHost.appendChild(buildRow(step)));
        paintProgress(data.progress || { done: 0, total: (data.steps || []).length });
      };
      api.step = (step) => {
        if (!step) return;
        ensureSkeleton('');
        const key = String(step.id);
        let row = rows.get(key);
        if (!row) { row = buildRow(step); stepsHost.appendChild(row); }
        else {
          row.className = 'plan-step st-' + (step.status || 'pending');
          const icon = row.querySelector('.ps-icon');
          if (icon) icon.textContent = PLAN_MARKS[step.status] || '○';
          const title = row.querySelector('.ps-title');
          if (title) title.textContent = step.title || '';
          let note = row.querySelector('.ps-note');
          if (step.note) {
            if (!note) { note = el('span', 'ps-note'); row.appendChild(note); }
            note.textContent = '（' + step.note + '）';
          } else if (note) { note.remove(); }
        }
        countDone();
      };
      if (plan) api.render(plan);
      return api;
    }

    function runDeep(question) {
      addMessage('user', question);
      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;
      sendBtn.classList.add('loading');
      stopBtn.classList.add('show');
      activeController = new AbortController();
      const frame = assistantFrame();
      const trace = makeTrace(frame.box, frame.content);
      setTyping(frame.content, true);
      let fullText = '';
      let sources = [];
      const renderAnswer = () => {
        frame.content.innerHTML = mdToHtml(fullText);
        scrollBottom();
      };
      return streamDeep(question, (evt) => {
        if (evt.type === 'info') {
          trace.info('知识库状态：' + (evt.message || '') + ' · 引擎：' + (evt.backend || ''));
        } else if (evt.type === 'plan') {
          trace.plan(evt.queries || []);
        } else if (evt.type === 'search') {
          trace.search(evt);
        } else if (evt.type === 'gap') {
          trace.gap(evt.queries || []);
        } else if (evt.type === 'rerank') {
          trace.rerank(evt.count || 0);
        } else if (evt.type === 'token') {
          fullText += evt.content;
          setTyping(frame.content, false);
          frame.content.dataset.started = '1';
          frame.content.textContent = fullText;
          scrollBottom();
        } else if (evt.type === 'sources') {
          sources = evt.items || [];
        }
      }, activeController.signal).then((final) => {
        setTyping(frame.content, false);
        if (final) currentId = final.thread_id || currentId;
        if (final && final.type === 'error') {
          trace.fail('这次没跑完：' + final.message + '（可以直接再问一次）');
          if (fullText) renderAnswer();
        } else if (!fullText && final && final.answer) {
          fullText = final.answer;
          frame.content.textContent = fullText;
        }
        if (fullText) renderAnswer();
        trace.sources(sources.length ? sources : (final && final.sources) || []);
        localStorage.setItem(STORAGE_KEY, currentId);
        return refreshConversations();
      }).catch((error) => {
        setTyping(frame.content, false);
        trace.fail(error.name === 'AbortError'
          ? '已经停下了，想继续或换个问法都行'
          : '没能连上后端：' + error.message + '（确认服务在运行后重试）');
        if (fullText) renderAnswer();
      }).finally(() => {
        setTyping(frame.content, false);
        sendBtn.classList.remove('loading');
        stopBtn.classList.remove('show');
        activeController = null;
        refreshSend();
        input.focus();
      });
    }

    function sendQuestion(text) {
      if (!text || !currentId || sendBtn.disabled) return;
      input.value = text;
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 160) + 'px';
      refreshSend();
      form.requestSubmit();
    }

    function refreshSend() {
      const can = !sendBtn.classList.contains('loading') && !!(input.value.trim()) && !!currentId;
      sendBtn.disabled = !can;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question || sendBtn.disabled || !currentId) return;
      if (useDeep()) {
        runDeep(question);
        return;
      }
      addMessage('user', question);
      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;
      sendBtn.classList.add('loading');
      stopBtn.classList.add('show');
      activeController = new AbortController();
      const answerEl = addMessage('assistant', '', { typing: true });
      const started = () => answerEl.dataset.started === '1';
      // 执行计划面板：后端产出 plan / plan_step / thinking 事件时才创建
      const answerBox = answerEl.parentElement ? answerEl.parentElement.parentElement : null;
      let planPanel = null;
      const planView = () => {
        if (!planPanel && answerBox && answerEl.parentElement) {
          planPanel = makePlanPanel(answerBox, answerEl);
        }
        return planPanel;
      };
      // 生成中的状态行：把「正在调用工具：execute_sql」换成人话
      let statusLine = null;
      const statusView = () => {
        if (!statusLine && answerBox && answerEl.parentElement) {
          statusLine = makeStatusLine(answerBox, answerEl);
        }
        return statusLine;
      };
      let fullText = '';
      let sources = [];
      const render = () => { answerEl.innerHTML = mdToHtml(fullText); scrollBottom(); };
      // rewind：后端发现这一轮其实是“调工具前的过渡句”，已经流式吐出去的字要撤回
      const rewind = (chars) => {
        const n = Number(chars) || 0;
        if (!n) return;
        fullText = fullText.slice(0, Math.max(0, fullText.length - n));
        if (!fullText) {
          answerEl.dataset.started = '';   // 回到“还没开始作答”，工具进度还能照常显示
          if (statusLine) statusLine.hide();
          setTyping(answerEl, true);
        } else {
          answerEl.textContent = fullText;
        }
        scrollBottom();
      };
      try {
        const final = await streamChat(question, (evt) => {
          if (evt.type === 'thinking') {
            const panel = planView(); if (panel) panel.thinking(evt.message);
          } else if (evt.type === 'plan') {
            const panel = planView(); if (panel) panel.render(evt);
          } else if (evt.type === 'plan_step') {
            const panel = planView(); if (panel) panel.step(evt.step);
          } else if (evt.type === 'tool' && !started()) {
            const human = evt.label || ('正在使用 ' + evt.name);
            const line = statusView(); if (line) line.show(human + '…');
            if (showProcess()) fullText = human + '…\n';   // 「显示过程」勾选时仍写进正文
          } else if (evt.type === 'rewind') {
            rewind(evt.chars);
          } else if (evt.type === 'token') {
            const line = statusView(); if (line) line.hide();
            fullText += evt.content;
            answerEl.dataset.started = '1';
            setTyping(answerEl, false);
            answerEl.textContent = fullText;
            scrollBottom();
          } else if (evt.type === 'sources') {
            sources = evt.items || [];
          }
        }, activeController.signal);
        currentId = final.thread_id || currentId;
        sources = final.sources || sources;
        localStorage.setItem(STORAGE_KEY, currentId);
        if (final.type === 'error') {
          const detail = String(final.message || '未知错误').trim();
          fullText += started()
            ? '\n\n> ⚠️ **这次没跑完**：' + detail + '\n>\n> 可以直接再问一次；如果是刚改过配置，重启服务后就正常了。'
            : '> ⚠️ **这次没跑通**：' + detail + '\n>\n> 先确认服务在运行、网络通畅，然后重试即可。';
        } else if (!started()) {
          fullText = final.answer || '我这次没组织出回答，换个问法或再说一次试试？';
        }
        render();
        renderSources(answerBox, answerEl, sources);   // 数据来源挂在回答卡片下方
        await refreshConversations();
      } catch (error) {
        const aborted = error.name === 'AbortError';
        fullText += started()
          ? (aborted ? '\n\n> ✋ 已经停下了，想继续或换个问法都行。'
                     : '\n\n> ⚠️ **连接中断了**：' + error.message + '\n>\n> 确认服务在运行后，再发一次就好。')
          : (aborted ? '已经停下了，想继续或换个问法都行。'
                     : '> ⚠️ **没能连上或中途断了**：' + error.message + '\n>\n> 确认服务在运行、网络通畅后再试一次。');
        render();
      } finally {
        if (statusLine) statusLine.hide();
        setTyping(answerEl, false);
        sendBtn.classList.remove('loading');
        stopBtn.classList.remove('show');
        activeController = null;
        refreshSend();
        input.focus();
      }
    });

    /* ---------------- 交互 ---------------- */
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 160) + 'px';
      refreshSend();
    });
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        if (!sendBtn.disabled) form.requestSubmit();
      }
    });
    convSearch.addEventListener('input', renderConversations);
    stopBtn.addEventListener('click', () => {
      if (activeController) activeController.abort();
    });
    document.querySelector('#new-chat').addEventListener('click', () => {
      createConversation().catch((error) => alert('新建会话没成功：' + error.message));
    });
    document.querySelector('#rename-btn').addEventListener('click', () => {
      if (!currentId) return;
      const li = convList.querySelector('.conv.active');
      if (li) startRename(currentId, li);
    });
    document.querySelector('#delete-btn').addEventListener('click', () => {
      if (currentId) removeConversation(currentId);
    });
    document.querySelector('#clear-all').addEventListener('click', () => {
      clearAllConversations();
    });
    document.querySelectorAll('.chip').forEach((chip) => {
      chip.addEventListener('click', () => sendQuestion(chip.childNodes[0].textContent.trim()));
    });

    /* ---------------- 按时间的问候（让空状态更有人味） ---------------- */
    const GREETINGS = [
      { until: 5,  hi: '夜深了，我是九天梧桐', sub: '还没休息？有事说一声，我随时在。' },
      { until: 9,  hi: '早上好，我是九天梧桐', sub: '新的一天，把问题丢给我：查数、翻资料、做预测都行。' },
      { until: 12, hi: '上午好，我是九天梧桐', sub: '把业务问题直接问出来，我来查数、检索资料、做预测、记住你的偏好。' },
      { until: 14, hi: '中午好，我是九天梧桐', sub: '午休也能问两句，查数据、找政策我都在。' },
      { until: 18, hi: '下午好，我是九天梧桐', sub: '下午适合出结论，要不要我先把数据整一整？' },
      { until: 23, hi: '晚上好，我是九天梧桐', sub: '晚上好，复盘今天的数据、做份预测，随时说。' },
      { until: 24, hi: '夜深了，我是九天梧桐', sub: '夜深了，有事说一声，剩下的交给我。' },
    ];
    function applyGreeting() {
      const titleNode = document.querySelector('#empty-title');
      const subNode = document.querySelector('#empty-sub');
      if (!titleNode || !subNode) return;
      const hour = new Date().getHours();
      const item = GREETINGS.find((g) => hour < g.until) || GREETINGS[0];
      titleNode.textContent = item.hi;
      subNode.textContent = item.sub;
    }
    applyGreeting();

    /* ---------------- 数据技能卡选项（由后端 /api/skills 动态下发） ---------------- */
    function loadSkillOptions() {
      fetch('/api/skills')
        .then((res) => res.json())
        .then((data) => {
          const has = (v) => [...skillEl.options].some((o) => o.value === v);
          (data.skills || []).forEach((s) => {
            if (has(s.key) || s.ready === false) return;
            const opt = document.createElement('option');
            opt.value = s.key;
            opt.textContent = s.title;
            skillEl.appendChild(opt);
          });
          if (skillEl.value && !has(skillEl.value)) {
            skillEl.value = '';
            localStorage.setItem(SKILL_KEY, '');
            paintSkill();
          }
        })
        .catch(() => { /* 后端暂不可用：保留“自动识别”单项即可 */ });
    }
    loadSkillOptions();

    (async function init() {
      try {
        await refreshConversations();
        const saved = localStorage.getItem(STORAGE_KEY);
        const target = conversations.find((item) => item.id === saved) || conversations[0];
        if (target) {
          await selectConversation(target.id, { silent: true });
        } else {
          await createConversation();
        }
      } catch (error) {
        titleEl.textContent = '服务未启动';
        emptyEl.innerHTML = '<h2>暂时连不上后端</h2><p>麻烦确认一下 <code>python web.py</code>（或 <code>start_web.bat</code>）正在运行，然后刷新本页即可。<br><small>技术细节：' + esc(error.message) + '</small></p>';
      } finally {
        refreshHealth();
      }
    })();
  </script>
</body>
